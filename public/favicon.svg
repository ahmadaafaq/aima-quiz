<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield / Tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Outer Emblem Border Accent -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.4" />

  <!-- Shield Shape Behind Monogram -->
  <path d="M32 10 L48 16 C48 30 32 44 32 48 C32 44 16 30 16 16 Z" fill="url(#crimsonGrad)" opacity="0.25" />
  <path d="M32 12 L46 17.5 C46 29 32 41 32 45 C32 41 18 29 18 17.5 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" />

  <!-- Central Trophy / Leadership Star Crown -->
  <path d="M32 17 L34 22 L39 22.5 L35 26 L36.5 31 L32 28 L27.5 31 L29 26 L25 22.5 L30 22 Z" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Typography Monogram: ICL (India Case League) -->
  <text x="32" y="47" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" letter-spacing="1.5" fill="#ffffff">
    ICL
  </text>

  <!-- AIMA 2026 Micro Subtitle Badge -->
  <rect x="18" y="50" width="28" height="7" rx="3.5" fill="url(#crimsonGrad)" />
  <text x="32" y="55.2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="4.5" letter-spacing="0.8" fill="#ffffff">
    2026
  </text>
</svg>
